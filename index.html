<!DOCTYPE html>
<!--
  NOTA DE ARQUITECTURA: este index.html vive en la RAÍZ del proyecto porque el
  workflow de GitHub Pages (.github/workflows/deploy.yml) publica el repositorio
  completo (upload-pages-artifact con path: '.') y Pages sirve el index.html del
  directorio raíz. Los recursos estáticos (favicon, estilos del entorno) siguen
  en /public y el JavaScript compilado por `tsc` se sirve desde /dist.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Componentes UI · Multi-Motor</title>
    <meta
      name="description"
      content="Biblioteca viva de componentes UI parametrizables: busca, filtra por motor, previsualiza, personaliza y copia el código generado (DOM, SVG, Canvas 2D, WebGL, WebXR, videojuegos, WASM)."
    />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <script>
      // Aplica el tema ANTES de pintar para evitar el destello (FOUC):
      // prioriza la preferencia guardada; si no existe, la del sistema.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('gcui-theme');
        } catch (error) {
          saved = null;
        }
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="./public/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
